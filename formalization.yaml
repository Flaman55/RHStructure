automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude (claude.ai agent with a bridge to the author's computer)"
      tool_setup: >
        November 2026 sessions, directed by the author. The agent wrote the Lean files of
        `Structural/` and `Applications/`, `Challenge.lean`, `Solution.lean`, the porting script
        and the ported files of `PNTPort/`, this file, the README and the note. The agent had no
        Lean toolchain: every build was run by the author on his computer (WSL, Lean v4.35.0) and
        its log returned to the agent, which corrected the sources until the builds succeeded.
        The mathematical route of the application (contour shift to Re s = 1/2 + delta,
        Borel-Caratheodory for zeta'/zeta under RH, interpolated Mellin bound) was proposed by the
        agent and agreed by the author; the choice of the advertised surface and of the
        structural reading is the author's.
      cost:
        wall_time: "about two hours for the application (four steps), 26 November 2026"
        spend_usd: "not tracked (subscription-based usage)"
        hardware: "author's computer"
      prompting_notes: >
        The agent translated the agreed steps into Lean and repaired build failures; correctness
        is decided by the Lean kernel and the axiom audit.
  spend_usd: "not tracked (subscription-based usage)"
  notes: >
    Lean source and prose were written by an agent under the author's direction; all builds were
    run and checked by the author.

fidelity:
  divergences: >
    (a) The advertised psi statement is the form of von Koch's section 7 (x^delta for every
    delta > 0); his final section and Cramer's gap bound have logarithmic factors instead and are
    sharper; the sharper forms are not formalized here. (b) The statements are eventual (for x >= x_0) with constants that are
    not made explicit. (c) `Chebyshev.psi x` is Mathlib's sum of Lambda(n) over 0 < n <= floor x;
    `x ^ (1/2 + delta)` is `Real.rpow`, applied only to x >= x_0, and x_0 >= 1 can always be
    assumed, so no rpow of a negative number is reached. (d) The prime statement gives x < p and
    p <= x + x^(1/2 + epsilon) for real x; it is stated for real, not only integer, x. (e) The
    Riemann Hypothesis enters as Mathlib's `RiemannHypothesis`, proved in grh-compact; the
    statements in Challenge.lean carry no hypothesis.

review:
  status: "self-assessed"
  reviewers: ["Artur Flamandzki"]
  notes: >
    The author directed the work and ran and checked every Lean build, but did not read the
    agent-written Lean source line by line. The two advertised statements are short and are meant
    to be read directly; their proofs are checked by the Lean kernel and by Comparator's axiom
    audit.

alignment:
  namespace: "RHStructure"
  statements:
    - source: "Note, Theorem (psi error term), Section 'An application: primes in short intervals'"
      lean: "Submission.chebyshev_psi_error / RHStructure.chebyshev_psi_of_RH"
      module: "Challenge.lean, Solution.lean, Applications/RHPsi.lean"
      status: "proved"
      note: "Von Koch 1901, section 7; see fidelity (a)."
    - source: "Note, Theorem (primes in short intervals), same section"
      lean: "Submission.exists_prime_in_short_interval / RHStructure.exists_prime_short_interval_of_RH"
      module: "Challenge.lean, Solution.lean, Applications/ShortInterval.lean"
      status: "proved"
      note: "Consequence of von Koch 1901, section 7, for theta; see fidelity (a)."

